name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        # The failing tests are annotations too: they read without a login.
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee test.log || {
            # A step shows ten annotations: a race's own frames first.
            { awk '/WARNING: DATA RACE/{p=1} p&&n<40{print; n++}' test.log | grep -E '(Write|Read) at|azhaq/[a-z]' | head -6
              grep -E -- '--- FAIL|panic:|_test.go:[0-9]+:|^FAIL|signal: |\[build failed\]|^# ' test.log | head -20; } | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: licenses
        # GPL, AGPL, SSPL and unknown licenses fail the build.
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,restricted,unknown
