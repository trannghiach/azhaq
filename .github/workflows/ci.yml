name: ci

on:
  push:
    # Every branch the work is pushed on: the race tests run here, not on the
    # author's machine. ci-results holds the workflows' outputs only.
    branches-ignore: [ci-results]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: golangci-lint
        # forbidigo: only internal/egress opens an outbound connection (.golangci.yml).
        # Built with the Go of the job: a release built with an older one refuses the module.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: commit messages
        # Every commit of the push, against .commitlintrc.yml (CONTRIBUTING.md).
        if: github.event_name == 'push' && !startsWith(github.event.before, '0000000')
        run: |
          git fetch -q --depth=50 origin "${{ github.event.before }}" || git fetch -q --unshallow origin
          npm i -g --silent @commitlint/cli@19.8.1
          commitlint --from "${{ github.event.before }}" --to HEAD
      - name: range scripts
        # The workflow trials' estate builder, grader and isolation script.
        run: |
          python3 -m unittest discover -s .github/ci/range
          bash -n .github/ci/range/isolate.sh .github/ci/run.sh .github/ci/fetch.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        # The failing tests are annotations too: they read without a login.
        run: |
          set -o pipefail
          # bash -e: a grep that finds nothing must not end the step before the lines are shown.
          go test -race ./... 2>&1 | tee test.log || {
            # A step shows ten annotations: a race's own frames first.
            { awk '/WARNING: DATA RACE/{p=1} p&&n<40{print; n++}' test.log | grep -E '(Write|Read) at|azhaq/[a-z]' | head -6 || true
              grep -E -- '--- FAIL|panic:|_test.go:[0-9]+:|^FAIL|signal: |\[build failed\]|^# ' test.log | head -20 || true; } | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: ephemeral range
        # It connects to every ephemeral port, so it runs with nothing else.
        run: AZHAQ_EPHEMERAL_SCAN=1 go test -race -count=1 ./internal/portscan -run TestEphemeralRangeHasNoPhantomPorts
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: licenses
        # GPL, AGPL, SSPL and unknown licenses fail the build.
        run: go run github.com/google/go-licenses/v2@v2.0.1 check ./... --disallowed_types=forbidden,restricted,unknown
