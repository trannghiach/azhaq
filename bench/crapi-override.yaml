# Applied on top of crAPI v1.1.6's deploy/docker/docker-compose.yml.
#
# Upstream tags its images only as "latest", so they are pinned here by
# digest (the "latest" of 2025-09-22, which v1.1.6 shipped with).
#
# crapi-web's nginx refuses to start when the chatbot host does not
# resolve. The chatbot needs an LLM key and ChromaDB, so its upstream
# points at a service that is running instead; chatbot routes answer 404.
services:
  crapi-identity:
    image: crapi/crapi-identity:latest@sha256:5d1db5b3ba8e02bc68711ec6fc4e35ed7cd8b87e63785ece9e7ff5b5e36c5260
  crapi-community:
    image: crapi/crapi-community:latest@sha256:8ba0c7eda86ae065a673f1fa554d0109a24f25c5a8d65097ae024e5ee715c54e
  crapi-workshop:
    image: crapi/crapi-workshop:latest@sha256:d4d2d94d35a31e211b04d5a771881f5ae13e358e8fa0804463ae3bace05dd815
  crapi-web:
    image: crapi/crapi-web:latest@sha256:b27d246c646bd33898e7d1d2095b6e7576c0993a7b81a73aa7386929493d7151
    environment:
      - CHATBOT_SERVICE=crapi-community:8087
  mailhog:
    image: crapi/mailhog:latest@sha256:015c23f79d40c9dc1800cd0a458503b89aeda3b585a12c37d53829d6c7d61fdd
  postgresdb:
    image: postgres:14@sha256:8ab94f61668dc73bbab4dc13273ff2fc37e635536af62aef5306a49a9682a446
  mongodb:
    image: mongo:4.4@sha256:4be76f674fc4b27859816811b8baa3c51830eb1dbf4ca81a51e26b79edd662ef
